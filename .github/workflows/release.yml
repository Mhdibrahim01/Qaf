name: Release APK

# Publish by pushing a tag, e.g.:  git tag v3.2.0 && git push origin v3.2.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Version from tag
        run: |
          echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare release assets
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "Qaf-${APP_VERSION_NAME}.apk"
          cp "$APK" "Qaf.apk"
          SHA=$(sha256sum "Qaf-${APP_VERSION_NAME}.apk" | cut -d' ' -f1)
          cat > update.json <<EOF
          {
            "versionCode": ${APP_VERSION_CODE},
            "versionName": "${APP_VERSION_NAME}",
            "apkUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Qaf-${APP_VERSION_NAME}.apk",
            "sha256": "${SHA}",
            "notes": "See the release page for details"
          }
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Qaf-*.apk
            Qaf.apk
            update.json
